name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un PR que recibe varios pushes seguidos no necesita terminar los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que el harvester en producción (Dockerfile.harvester).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        # pytest no está declarado en requirements.txt, que sólo lista lo que
        # necesita el harvester en runtime. Se instala aparte para no sumarle
        # una dependencia de desarrollo a la imagen.
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        run: pytest
