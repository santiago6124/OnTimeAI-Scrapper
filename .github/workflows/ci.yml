name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un PR que recibe varios pushes seguidos no necesita terminar los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compara contra la rama base: necesita el historial.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Misma versión que el harvester en producción (Dockerfile.harvester).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        # Dos archivos, no intercambiables:
        #   requirements.txt      → runtime del harvester (Dockerfile.harvester).
        #   requirements-dev.txt  → pytest, cobertura (pytest-cov, diff-cover) y
        #                           las herramientas del gate de complejidad
        #                           (ruff, radon), que no viajan en la imagen.
        #                           Se instalan en un solo comando para que pip
        #                           resuelva las restricciones de las dos listas
        #                           a la vez.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Complejidad ciclomática
        # Gate: ninguna función del paquete `ontimeai_scrapper` por encima de 10
        # (McCabe, ruff C901) fuera de las exentas en .complejidad-baseline.json,
        # y esa lista sólo puede achicarse. Corre antes que los tests porque
        # tarda segundos y un fallo acá no necesita la suite entera. El reporte
        # de radon va al resumen del job y como artifact. Ver docs/COMPLEJIDAD.md.
        run: |
          python scripts/complejidad.py --check \
            --reporte complejidad.json \
            --resumen "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complejidad
          path: complejidad.json

      - name: Bugs críticos (análisis estático)
        # Errores de sintaxis, nombres indefinidos, redefiniciones y
        # comparaciones inválidas: lo que revienta en tiempo de ejecución, no
        # estilo. Selección E9, F63, F7, F82 (la del template de Python de
        # GitHub Actions) sobre el alcance de pyproject.toml.
        run: ruff check --output-format github .

      - name: Duplicación
        # Quality gate: más de 5 % de líneas duplicadas en el código productivo
        # corta el pipeline. jscpd corre con npx porque no hay un equivalente
        # en Python que dé el porcentaje; el runner ya trae Node.
        run: |
          npx --yes jscpd@4 --min-tokens 50 --min-lines 5 --threshold 5 \
            --format python --reporters console,json --output jscpd \
            ontimeai_scrapper

      - name: Tests con cobertura
        # Corren todos. La cobertura mide líneas y ramas (cobertura de
        # decisión) sobre el alcance de pyproject.toml y falla por debajo del
        # trinquete de `fail_under`.
        run: pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=junit.xml

      - name: Cobertura sobre el código nuevo
        # Quality gate: las líneas que cambia el PR tienen que estar cubiertas
        # al 80 %. Sólo en PR, porque en main no hay contra qué comparar.
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 --markdown-report diff-cover.md

      - name: Resumen de calidad
        if: always()
        run: |
          python scripts/calidad_resumen.py --cobertura coverage.xml \
            --jscpd jscpd/jscpd-report.json --diff-cover diff-cover.md \
            --salida "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad
          path: |
            coverage.xml
            junit.xml
            jscpd/
            diff-cover.md
          if-no-files-found: ignore
