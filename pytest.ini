[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra -q

# El paquete `ontimeai_scrapper` vive en la raiz del repo, que pytest no agrega
# solo a sys.path. Sin esto los cuatro modulos de test fallan al importar con
# "No module named 'ontimeai_scrapper'". Mismo criterio que el pyproject.toml
# del Backend.
pythonpath = .
