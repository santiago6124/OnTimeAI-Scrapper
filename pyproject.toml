# Configuración de ruff y de coverage. La de pytest sigue en pytest.ini, que
# tiene precedencia sobre este archivo y no hace falta moverla.

[tool.ruff]
# Mismo alcance que scripts/complejidad.py: lo que despliega Dockerfile.harvester,
# que copia a la imagen únicamente el paquete `ontimeai_scrapper`. Los tests y
# los scripts de `scripts/` (validate_sources.py, analyze_future_legs.py) son
# herramientas de desarrollo: no viajan en la imagen y quedan fuera.
extend-exclude = [
    "tests",
    "scripts",
]

[tool.ruff.lint]
# Complejidad (ver docs/COMPLEJIDAD.md) más los "bugs críticos": errores de
# sintaxis, nombres indefinidos, redefiniciones y comparaciones inválidas, lo
# que revienta en tiempo de ejecución. Es la misma selección que usa el
# template de Python de GitHub Actions (E9, F63, F7, F82). Las reglas de
# estilo son otra decisión, con su propia baseline.
select = ["C901", "E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
# Qué se mide: exactamente lo que despliega Dockerfile.harvester, el paquete
# `ontimeai_scrapper`; es el mismo alcance que el gate de complejidad y que la
# medición del hub OnTimeAI-Calidad. Los scripts de `scripts/` son
# herramientas de desarrollo con tests propios, pero no corren en producción
# y no entran en el número.
source = ["ontimeai_scrapper"]
omit = ["tests/*"]

[tool.coverage.report]
# Trinquete de cobertura: el total (sentencias más ramas) no puede bajar de
# acá. Se sube a mano cada vez que la cobertura crece de verdad. Línea de base
# del 2026-10-22 sobre el paquete desplegado (commit 2697284): 50,7 % de
# líneas, 33,7 % de ramas, 46,7 % combinado. Subido a 60 el 2026-10-23 tras
# los PRs #21, #22 y #23 (60.7 % combinado en main).
fail_under = 60
precision = 1
